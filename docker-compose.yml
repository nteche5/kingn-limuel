version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - SWC_USE_WASM=1
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
volumes:
  node_modules:


